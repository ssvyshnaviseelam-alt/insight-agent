services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insightagent-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: insightagent-streamlit
    env_file:
      - .env
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - api